# Photography gallery for /photography/, shown newest first (sorted by `date`).
#
# Managed together with scripts/build_photos.py:
#   - Add a photo:    drop the original into photography/originals/ (name it
#                     descriptively, e.g. austin-sunset.jpg), then run
#                     python3 scripts/build_photos.py  (or keep it running with --watch).
#                     It is compressed and added to this list with its EXIF date,
#                     plus its place when the photo has GPS data;
#                     fill in or check its title / place / caption.
#   - Remove a photo: delete its original and run the script again.
#   - Hide a photo:   add `hidden: true` to its entry (keeps the original and text).
#   - Reorder:        change the `date`; order in this file does not matter.
#
# Fields: id (= original file name without extension), title,
#         caption (optional, HTML allowed), place, date (YYYY-MM-DD), hidden.


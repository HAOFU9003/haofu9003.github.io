title: Hao Fu's Homepage
author: Hao Fu
email: haofu@utexas.edu
description: "Personal academic homepage of Hao Fu."

# =============================================
# Academic Homepage Configuration
# Fill in your information below
# =============================================
academic:
  name: "Hao Fu"
  name_zh: "付豪"          # shown next to the name on the homepage; "" to hide
  position: "Ph.D. Student"
  affiliation: "University of Texas at Austin"
  avatar: "assets/img/head.jpg"
  avatar_style: "rounded"  # Options: "circle", "rounded", "square". Use "rounded" for half-body shot.
  bio: |
    I am a Ph.D. student at The University of Texas at Austin, where I am fortunate to be advised by Professor <a href="https://www.cs.utexas.edu/~pstone/">Peter Stone</a>. My research is at the intersection of robotics and reinforcement learning, with a specific focus on <strong>humanoid robots</strong>. 
    Prior to joining UT Austin, I earned my M.S. from Tsinghua University and my B.S. from Xi'an Jiaotong University. 
    Beyond research, I am a passionate <a href="/photography/">photographer</a> and an avid soccer player, I also play guitar, basketball and computer games in my spare time.
  email: "haofu@utexas.edu"
  google_scholar: ""       # Full URL to your Google Scholar profile
  github: "haofu9003"               # GitHub username
  linkedin: ""             # LinkedIn username
  twitter: ""              # Twitter/X username
  cv: ""                   # Path to your CV PDF, e.g. "assets/files/cv.pdf"
  address: "Austin TX"              # e.g., "Room XXX, Building, University, City"
  enable_dark_mode: true   # Enable dark mode support

  # Logo badges under the photo: `logo` is a square image, `short` the label
  # under it (defaults to `name`), `name` the full name shown on hover.
  groups:
    - name: "Texas Robotics"
      url: "https://robotics.utexas.edu/"
      logo: "assets/img/logos/texas-robotics.png"
    - name: "Learning Agents Research Group"
      short: "LARG"
      url: "https://larg.cs.utexas.edu/"
      logo: "assets/img/logos/larg.png"

  research_interests:
    - "Robot Learning"
    - "Reinforcement Learning"
    - "Humanoid Robots"

  news:
    - date: "2026-02"
      text:  I will be joining <a href="https://www.sonycsl.co.jp/en/">Sony CSL</a> as a Research Intern in summer 2026!
    - date: "2024-08"
      text: 'Arrived in Austin to begin my PhD life!'

  publications:
    - title: "FMP-STEER: Steering Flow-Based Motion Priors for Real-World Humanoid Reinforcement Learning"
      venue: "Under review"
      image: "assets/img/papers/fmp-steer.jpg"
      project: "https://roboticspage.github.io/FMP-STEER/"

    - title: "Let the Robot Play Your Hand: Learning Executable Trajectories for Piano Playing with a Human-Compatible Arm-Hand Exoskeleton"
      venue: "Under review"
      image: "assets/img/papers/piano-exoskeleton.jpg"

    - title: "Learning Agile Striker Skills for Humanoid Soccer Robots from Noisy Sensory Input"
      authors: "Zifan Xu, Myoungkyu Seo, Dongmyeong Lee, <strong>Hao Fu</strong>, Jiaheng Hu, Jiaxun Cui, Yuqian Jiang, Zhihan Wang, Anastasiia Brund, Joydeep Biswas, Peter Stone"
      venue: "IEEE International Conference on Robotics and Automation (ICRA)"
      year: 2026
      pdf: "https://arxiv.org/pdf/2512.06571"
      arxiv: "https://arxiv.org/abs/2512.06571"
      project: "https://humanoidsoccer.github.io/"
      image: "assets/img/papers/humanoid-soccer-striker.jpg"

  competitions:
    - title: "RoboCup 2026 · Incheon, Korea"
      role: "UT Austin Villa · Humanoid Soccer League, Large Robot Division"
      description: "Team member of UT Austin Villa, competing with the Booster T1 humanoid robot. The team reached the semi-finals and finished 4th of 22 teams in the Large Robot Division."
      website: "https://www.cs.utexas.edu/~AustinVilla/humanoid/"




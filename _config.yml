  avatar: "assets/css/images/head.jpg"
  avatar_style: "rounded"  # Options: "circle", "rounded", "square". Use "rounded" for half-body shot.
  bio: |
    I am a Ph.D. student in Mechanical Engineering at The University of Texas at Austin, where I am fortunate to be advised by Professor <a href="https://www.cs.utexas.edu/~pstone/">Peter Stone</a>. My research is at the intersection of robotics and reinforcement learning, with a specific focus on the <strong>locomotion of humanoid robots</strong>. 
    Prior to joining UT Austin, I earned my M.S. in Electronic and Information Engineering from Tsinghua University and my B.S. in Mechanical Engineering from Xi'an Jiaotong University. 
    Beyond research, I am a passionate <a href="https://haofu9003.github.io/">photographer</a> and an avid soccer player, I also play guitar, basketball and computer games in my spare time.
